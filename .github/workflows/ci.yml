name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Only run one CI job per branch/PR at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      # ── Node / CSS ──────────────────────────────────────────────────────────
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build CSS (production)
        run: npm run build

      # ── Ruby / Jekyll ───────────────────────────────────────────────────────
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      
      - name: Validate production domain metadata
        run: |
          test -f CNAME
          test "$(tr -d '\r\n' < CNAME)" = "dhananjaytomar.com"

          test -f _site/sitemap.xml

          grep -q 'https://dhananjaytomar.com/' _site/index.html
          grep -q '<loc>https://dhananjaytomar.com/' _site/sitemap.xml

      - name: Validate generated HTML and internal links
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external

      - name: Verify key output pages exist
        run: |
          test -f _site/index.html     || { echo "Missing index.html";     exit 1; }
          test -f _site/blog.html      || { echo "Missing blog.html";       exit 1; }
          test -f _site/about.html     || { echo "Missing about.html";      exit 1; }
          test -f _site/research.html  || { echo "Missing research.html";   exit 1; }

      - name: Run responsive and accessibility checks
        run: node ./scripts/responsive-check.mjs
        env:
          RESPONSIVE_SCREENSHOT_DIR: ${{ runner.temp }}/responsive-check

      - name: Upload responsive screenshots
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: responsive-check-artifacts
          path: ${{ runner.temp }}/responsive-check
          if-no-files-found: ignore
          retention-days: 30